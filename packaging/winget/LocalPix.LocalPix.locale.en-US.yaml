ShortDescription: Free, offline image converter — nothing leaves your machine
Description: |-
  LocalPix converts images between 13 input and 11 output formats
  (JPEG, PNG, WebP, AVIF, JPEG XL, JPEG 2000, OpenEXR, GIF, TIFF, BMP,
  ICO, plus HEIC/PSD/SVG/PDF input) entirely on your computer. No
  uploads, no account, no telemetry. Batch conversion, per-file
  overrides, transforms (resize, rotate, crop), metadata stripping,
  filename templates, and presets.
